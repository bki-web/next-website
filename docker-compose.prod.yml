services:
  web-2025:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pass the build-time environment variable here
        NEXT_PUBLIC_STRAPI_API_URL: ${NEXT_PUBLIC_STRAPI_API_URL}
        DATABASE_URL: ${DATABASE_URL}
        NEXT_PUBLIC_SHIP_REGISTER_API_URL: ${NEXT_PUBLIC_SHIP_REGISTER_API_URL}
        NEXT_PUBLIC_OLD_WEBSITE_URL: ${NEXT_PUBLIC_OLD_WEBSITE_URL}
        APP_URL: ${APP_URL}
        OLD_API_BKI_URL: ${OLD_API_BKI_URL}
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web-2025

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet:  10.250.230.0/24

