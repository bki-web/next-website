version: '3.8'

services:
  web-2025:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web-2025

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet:  10.250.230.0/24

